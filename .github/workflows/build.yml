name: Build GeodomDesk

on:
  workflow_dispatch:
    inputs:
      reuse_desktop_run:
        description: 'Optional failed run with successful, unpublished desktop builds; exact source/recipe checks required'
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['geodomdesk/**', '.github/workflows/build.yml', '!geodomdesk/**/*.md', '!geodomdesk/assets/DESIGN.txt']
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: read

concurrency:
  group: geodomdesk-native-build
  cancel-in-progress: false

env:
  RUST_VERSION: '1.85.1'
  FLUTTER_VERSION: '3.24.5'
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '3'

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      upstream_commit: ${{ steps.plan.outputs.upstream_commit }}
      build_number: ${{ steps.plan.outputs.build_number }}
      build: ${{ steps.plan.outputs.build }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.reuse_desktop_run != ''
        with:
          name: geodomdesk-windows
          path: reused-windows
          run-id: ${{ inputs.reuse_desktop_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.reuse_desktop_run != ''
        with:
          name: geodomdesk-ubuntu
          path: reused-ubuntu
          run-id: ${{ inputs.reuse_desktop_run }}
          github-token: ${{ github.token }}
      - name: Check reusable desktop configuration
        if: inputs.reuse_desktop_run != ''
        run: |
          python3 -c 'import json,pathlib; assert json.loads(pathlib.Path("reused-windows/geodomdesk-build-config.json").read_text()) == json.loads(pathlib.Path("reused-ubuntu/geodomdesk-build-config.json").read_text())'
          python3 -m pip install -r geodomdesk/requirements.txt
      - name: Follow the latest official stable source
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEODOMDESK_REUSE_DESKTOP_RUN: ${{ inputs.reuse_desktop_run }}
          GEODOMDESK_REUSE_CONFIG: reused-windows/geodomdesk-build-config.json
        run: python3 geodomdesk/plan_upstream.py

  bridge:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_COMMIT }}
          submodules: recursive
          path: client
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: client
          prefix-key: geodomdesk-bridge
          cache-on-failure: true
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: '3.22.3'
          cache: true
      - name: Install code generation prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake libclang-dev libgtk-3-dev ninja-build pkg-config nasm
          python3 -m pip install -r ../geodomdesk/requirements.txt
      - name: Prepare and validate source
        run: |
          python3 ../geodomdesk/prepare_client.py --source . --version "$VERSION" --build-number "$BUILD_NUMBER"
          CARGO_TARGET_DIR="$PWD/target/geodomdesk-verification" python3 ../geodomdesk/verify_rust.py --source .
      - name: Generate Flutter bridge
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Validate the customized UI before native compilation
        run: |
          python3 ../geodomdesk/patch_flutter_sdk.py
          python3 -c 'import build; build.ffi_bindgen_function_refactor()'
          sed -i 's/extended_text: 13.0.0/extended_text: 14.0.0/g' flutter/pubspec.yaml
          cd flutter
          flutter pub get
          dart format lib/models/model.dart lib/common/widgets/login.dart lib/desktop/pages/desktop_setting_page.dart lib/mobile/pages/connection_page.dart
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/models/model.dart lib/common/widgets/login.dart lib/desktop/pages/desktop_setting_page.dart lib/mobile/pages/connection_page.dart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geodomdesk-bridge
          if-no-files-found: error
          path: |
            client/src/bridge_generated.rs
            client/src/bridge_generated.io.rs
            client/flutter/lib/generated_bridge.dart
            client/flutter/lib/generated_bridge.freezed.dart
            client/flutter/lib/models/model.dart
            client/flutter/lib/common/widgets/login.dart
            client/flutter/lib/desktop/pages/desktop_setting_page.dart
            client/flutter/lib/mobile/pages/connection_page.dart

  windows:
    needs: [plan, bridge]
    if: needs.plan.outputs.reuse_run == ''
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        working-directory: client
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_COMMIT }}
          submodules: recursive
          path: client
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: client
          prefix-key: geodomdesk-windows
          cache-on-failure: true
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: '15.0.6'
      - name: Install current CMake for pinned vcpkg
        shell: pwsh
        run: |
          python -m pip install cmake==4.3.0
          python -m pip install -r ../geodomdesk/requirements.txt
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare independent client identity
        run: python ../geodomdesk/prepare_client.py --source . --version $env:VERSION --build-number $env:BUILD_NUMBER
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-bridge
          path: client
      - name: Patch the pinned Flutter SDK
        run: python ../geodomdesk/patch_flutter_sdk.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: geodomdesk-vcpkg-windows-x64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('client/vcpkg.json', 'client/res/vcpkg/**') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          doNotCache: false
      - name: Build native dependencies
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          cd "$GITHUB_WORKSPACE/client"
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build Windows Flutter bundle
        run: |
          python ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows build failed' }
          $exe = './flutter/build/windows/x64/runner/Release/GeodomDesk.exe'
          $version = (& $exe --version | Out-String).Trim()
          if ($version -ne $env:VERSION) { throw "Wrong compiled client version: $version" }
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          if ($info.ProductName -ne 'GeodomDesk') { throw 'The runner is not GeodomDesk' }
      - name: Build the independent privacy helper
        shell: pwsh
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow ../topmost-helper
          git -C ../topmost-helper checkout ecd8d6a139eee76845ea66423fb739af450fda90
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          & "$vs\MSBuild\Current\Bin\MSBuild.exe" ../topmost-helper/WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 -p:TargetVersion=Windows10
          if ($LASTEXITCODE -ne 0) { throw 'Privacy helper build failed' }
          Copy-Item ../topmost-helper/WindowInjection/x64/Release/WindowInjection.dll ./flutter/build/windows/x64/runner/Release/
      - name: Create portable update executable
        shell: pwsh
        run: |
          python -m pip install -r ./libs/portable/requirements.txt
          Push-Location libs/portable
          python ./generate.py -f ../../flutter/build/windows/x64/runner/Release -o . -e ../../flutter/build/windows/x64/runner/Release/GeodomDesk.exe
          if ($LASTEXITCODE -ne 0) { throw 'Portable packer failed' }
          Pop-Location
          New-Item -ItemType Directory -Force ../windows-artifact | Out-Null
          Copy-Item ./target/release/rustdesk-portable-packer.exe ../windows-artifact/GeodomDesk.exe
          Copy-Item ./geodomdesk-build-config.json ../windows-artifact/
      - name: Check installer commands
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ../geodomdesk/test-windows-installer.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geodomdesk-windows
          if-no-files-found: error
          path: windows-artifact/*

  ubuntu:
    needs: [plan, bridge]
    if: needs.plan.outputs.reuse_run == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: client
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
      VCPKG_DEFAULT_TRIPLET: x64-linux
      VCPKG_DEFAULT_HOST_TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_COMMIT }}
          submodules: recursive
          path: client
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: client
          prefix-key: geodomdesk-ubuntu
          cache-on-failure: true
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install native build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y build-essential clang cmake curl git libayatana-appindicator3-dev libasound2-dev libclang-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev libxtst-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols libdbus-1-dev libpam0g-dev nasm ninja-build pkg-config unzip xz-utils libssl-dev autoconf automake libtool
          python3 -m pip install cmake==4.3.0 -r ../geodomdesk/requirements.txt
          python3 -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> "$GITHUB_PATH"
      - name: Prepare independent client identity
        run: python3 ../geodomdesk/prepare_client.py --source . --version "$VERSION" --build-number "$BUILD_NUMBER"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-bridge
          path: client
      - name: Patch the pinned Flutter SDK
        run: python3 ../geodomdesk/patch_flutter_sdk.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: geodomdesk-vcpkg-ubuntu-x64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('client/vcpkg.json', 'client/res/vcpkg/**') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          doNotCache: false
      - name: Build native dependencies and Ubuntu package
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"
          export DEB_ARCH=amd64
          python3 ./build.py --flutter --hwcodec --unix-file-copy-paste
          mkdir -p ../ubuntu-artifact
          python3 ../geodomdesk/repack_deb.py --input "rustdesk-$VERSION.deb" --output ../ubuntu-artifact/geodomdesk.deb --version "$VERSION" --build-number "$BUILD_NUMBER"
          cp geodomdesk-build-config.json ../ubuntu-artifact/
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Archive corresponding source including modified submodules
        run: |
          python3 ../geodomdesk/archive_source.py --source . --customization ../geodomdesk --output ../ubuntu-artifact/geodomdesk-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geodomdesk-ubuntu
          if-no-files-found: error
          path: ubuntu-artifact/*

  android:
    needs: [plan, bridge]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: client
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_COMMIT }}
          submodules: recursive
          path: client
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: client
          prefix-key: geodomdesk-android-arm64
          cache-on-failure: true
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            client/flutter/android/**/*.gradle
            client/flutter/android/gradle/wrapper/gradle-wrapper.properties
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
      - name: Install Android build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y build-essential clang cmake curl gcc-multilib g++-multilib libclang-dev nasm ninja-build pkg-config autoconf automake libtool
          python3 -m pip install cmake==4.3.0 -r ../geodomdesk/requirements.txt
          python3 -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare independent Android client
        run: |
          python3 ../geodomdesk/prepare_client.py --source . --version "$VERSION" --build-number "$BUILD_NUMBER"
          python3 ../geodomdesk/patch_flutter_sdk.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-bridge
          path: client
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: geodomdesk-vcpkg-android-arm64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('client/vcpkg.json', 'client/res/vcpkg/**') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          doNotCache: false
      - name: Build Android native dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          ./flutter/build_android_deps.sh arm64-v8a
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build Android Rust library
        run: |
          cargo install cargo-ndk --version 3.1.2 --locked
          ./flutter/ndk_arm64.sh
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" flutter/android/app/src/main/jniLibs/arm64-v8a/
          python3 -c 'import build; build.ffi_bindgen_function_refactor()'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geodomdesk-android-native
          if-no-files-found: error
          path: |
            client/flutter/android/app/src/main/jniLibs/arm64-v8a/
            client/geodomdesk-build-config.json
      - name: Configure permanent Android signing identity
        env:
          GEODOMDESK_ANDROID_KEYSTORE: ${{ secrets.GEODOMDESK_ANDROID_KEYSTORE }}
          GEODOMDESK_ANDROID_KEY_PASSWORD: ${{ secrets.GEODOMDESK_ANDROID_KEY_PASSWORD }}
        run: python3 ../geodomdesk/android_release.py prepare --source . --file "$RUNNER_TEMP/geodomdesk-signing.p12"
      - name: Build and verify signed Android APK
        run: |
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/' flutter/android/gradle.properties
          cd flutter
          flutter pub get
          dart run flutter_launcher_icons -f ../../geodomdesk/android-icons.yaml
          # One ABI needs no split; Flutter otherwise adds an ABI offset to versionCode.
          flutter build apk --release --target-platform android-arm64 --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          cd ..
          python3 ../geodomdesk/android_release.py verify --source . --file flutter/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p ../android-artifact
          cp flutter/build/app/outputs/flutter-apk/app-release.apk ../android-artifact/geodomdesk.apk
          cp geodomdesk-build-config.json ../android-artifact/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: geodomdesk-android-diagnostic
          if-no-files-found: ignore
          retention-days: 3
          path: client/flutter/build/app/outputs/flutter-apk/app-release.apk
      - name: Remove temporary signing inputs
        if: always()
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "geodomdesk-signing.p12").unlink(missing_ok=True); pathlib.Path("flutter/android/key.properties").unlink(missing_ok=True)'
      - name: Archive corresponding source with generated Android resources
        run: python3 ../geodomdesk/archive_source.py --source . --customization ../geodomdesk --output ../android-artifact/geodomdesk-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geodomdesk-android
          if-no-files-found: error
          path: android-artifact/*

  release:
    needs: [plan, windows, ubuntu, android]
    if: always() && needs.plan.result == 'success' && needs.android.result == 'success' && (needs.plan.outputs.reuse_run != '' || (needs.windows.result == 'success' && needs.ubuntu.result == 'success'))
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-windows
          path: windows
          run-id: ${{ needs.plan.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-ubuntu
          path: ubuntu
          run-id: ${{ needs.plan.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-android
          path: android
      - name: Validate all builds and write release descriptor
        run: |
          python3 -c 'import json,pathlib; configs=[json.loads(pathlib.Path(p,"geodomdesk-build-config.json").read_text()) for p in ["windows","ubuntu","android"]]; assert configs[0] == configs[1] == configs[2]'
          python3 -m pip install -r geodomdesk/requirements.txt
          python3 geodomdesk/release_bundle.py --version "$VERSION" --repository "$GITHUB_REPOSITORY" --windows windows/GeodomDesk.exe --ubuntu ubuntu/geodomdesk.deb --android android/geodomdesk.apk --source-archive android/geodomdesk-source.tar.gz --build-config windows/geodomdesk-build-config.json --output release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geodomdesk-release
          if-no-files-found: error
          path: release/*
      - name: Publish a new stable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payloads=()
          for file in release/*; do
            if [ "$(basename "$file")" != geodomdesk-build.json ]; then payloads+=("$file"); fi
          done
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${payloads[@]}"
            gh release upload "$VERSION" release/geodomdesk-build.json --clobber
          else
            gh release create "$VERSION" "${payloads[@]}" --target "$GITHUB_SHA" --draft --title "GeodomDesk $VERSION" --notes 'Follows the official RustDesk version with GeodomDesk customization. Immutable custom build assets are listed in geodomdesk-build.json.'
            gh release upload "$VERSION" release/geodomdesk-build.json
          fi
          gh release edit "$VERSION" --draft=false --latest
