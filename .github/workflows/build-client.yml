name: Build GeodomDesk

on:
  workflow_dispatch:
    inputs:
      reuse_desktop_run:
        description: 'Optional failed run with successful, unpublished desktop builds; exact source/recipe checks required'
        type: string
        default: ''
      validation_only:
        description: 'Run Windows and Ubuntu checks for the selected branch'
        type: boolean
        default: false
      expected_sha:
        description: 'Exact source commit for an automated build'
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['customization/**', '.github/workflows/build-client.yml', 'CHANGELOG.md', '!customization/**/*.md']
  pull_request:
    branches: [main]
    paths: ['customization/**', '.github/workflows/build-client.yml', 'CHANGELOG.md', '!customization/**/*.md']
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.validation_only && format('geodomdesk-validation-{0}', github.sha) || github.event_name == 'pull_request' && format('geodomdesk-native-validation-{0}', github.event.pull_request.number) || 'geodomdesk-native-build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: '1.85.1'
  GEODOMDESK_BUILD_RUN_OFFSET: '141'
  FLUTTER_VERSION: '3.24.5'
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  plan:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.validation_only))
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      upstream_commit: ${{ steps.plan.outputs.upstream_commit }}
      build_number: ${{ steps.plan.outputs.build_number }}
      build: ${{ steps.plan.outputs.build }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
    steps:
      - name: Verify the requested build commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
          REUSE_RUN: ${{ inputs.reuse_desktop_run }}
        run: |
          if [[ -n "$EXPECTED_SHA" && "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo '::error::The requested source commit differs from the workflow checkout.'
            exit 1
          fi
          if [[ "$VALIDATION_ONLY" == "true" && -n "$REUSE_RUN" ]]; then
            echo '::error::Native validation requires a fresh Windows and Ubuntu build.'
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.reuse_desktop_run != ''
        with:
          name: geodomdesk-windows
          path: reused-windows
          run-id: ${{ inputs.reuse_desktop_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.reuse_desktop_run != ''
        with:
          name: geodomdesk-ubuntu
          path: reused-ubuntu
          run-id: ${{ inputs.reuse_desktop_run }}
          github-token: ${{ github.token }}
      - name: Check reusable desktop configuration
        if: inputs.reuse_desktop_run != ''
        run: |
          python3 -c 'import json,pathlib; configs=[json.loads(pathlib.Path(p,"geodomdesk-build-config.json").read_text()) for p in ["reused-windows","reused-ubuntu"]]; assert all(config == configs[0] for config in configs)'
          python3 -m pip install -r customization/requirements.txt
      - name: Resolve the reviewed official stable source
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEODOMDESK_REUSE_DESKTOP_RUN: ${{ inputs.reuse_desktop_run }}
          GEODOMDESK_REUSE_CONFIG: reused-windows/geodomdesk-build-config.json
        run: python3 customization/release/plan_upstream.py

  bridge:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_COMMIT }}
          submodules: recursive
          path: client
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Install code generation prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config
          python3 -m pip install -r ../customization/requirements.txt
      - name: Prepare client source
        run: python3 ../customization/packaging/prepare_client.py --source . --version "$VERSION" --build-number "$BUILD_NUMBER"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: client/target/geodomdesk-verification
          key: ${{ runner.os }}-verify-rust-${{ env.RUST_VERSION }}-${{ hashFiles('customization/tests/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-verify-rust-${{ env.RUST_VERSION }}-
      - name: Validate customized Rust components
        run: CARGO_TARGET_DIR="$PWD/target/geodomdesk-verification" python3 ../customization/packaging/verify_rust.py --source .
      - name: Compute Flutter bridge cache key
        id: bridge-key
        shell: bash
        run: |
          hash=$(python3 - <<'PY'
          import hashlib, os, pathlib, re
          h = hashlib.sha256()
          h.update(os.environ['RUST_VERSION'].encode() + b'\0')
          h.update(b'cargo-expand=1.0.95\0flutter_rust_bridge_codegen=1.80.1\0')
          h.update(os.environ['UPSTREAM_COMMIT'].encode() + b'\0')
          for p in ['src/flutter_ffi.rs', 'src/ui_interface.rs', 'Cargo.toml', 'Cargo.lock']:
              h.update(p.encode() + b'\0')
              h.update(pathlib.Path(p).read_bytes())
          pubspec = pathlib.Path('flutter/pubspec.yaml').read_bytes()
          pubspec = re.sub(rb'(?m)^version:.*\r?\n', b'', pubspec)
          h.update(b'flutter/pubspec.yaml\0' + pubspec)
          print(h.hexdigest())
          PY
          )
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: bridge-gen
        with:
          path: |
            client/src/bridge_generated.rs
            client/src/bridge_generated.io.rs
            client/flutter/lib/generated_bridge.dart
            client/flutter/lib/generated_bridge.freezed.dart
          key: ${{ runner.os }}-bridge-gen-${{ steps.bridge-key.outputs.hash }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        if: steps.bridge-gen.outputs.cache-hit != 'true'
        with:
          workspaces: client
          prefix-key: geodomdesk-bridge
          cache-on-failure: true
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        if: steps.bridge-gen.outputs.cache-hit != 'true'
        with:
          flutter-version: '3.22.3'
          cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.bridge-gen.outputs.cache-hit != 'true'
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-3.22.3-${{ env.UPSTREAM_COMMIT }}
          restore-keys: |
            ${{ runner.os }}-pub-3.22.3-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.bridge-gen.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ runner.os }}-cargo-bin-bridge-${{ env.RUST_VERSION }}-1.0.95-1.80.1
      - name: Generate Flutter bridge
        if: steps.bridge-gen.outputs.cache-hit != 'true'
        run: |
          if ! cargo-expand --version 2>/dev/null | grep -Fq '1.0.95'; then
            cargo install cargo-expand --version 1.0.95 --locked
          fi
          if ! flutter_rust_bridge_codegen --version 2>/dev/null | grep -Fq '1.80.1'; then
            cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          fi
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          sed -i 's/extended_text: 13.0.0/extended_text: 14.0.0/g' flutter/pubspec.yaml
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ env.UPSTREAM_COMMIT }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-
      - name: Validate the customized UI before native compilation
        run: |
          python3 ../customization/packaging/patch_flutter_sdk.py
          python3 -c 'import build; build.ffi_bindgen_function_refactor()'
          cd flutter
          flutter pub get
          dart format lib/common.dart lib/desktop/pages/connection_page.dart lib/desktop/pages/install_page.dart lib/desktop/pages/desktop_home_page.dart lib/desktop/pages/port_forward_page.dart lib/models/model.dart lib/common/widgets/dialog.dart lib/common/widgets/login.dart lib/desktop/pages/desktop_setting_page.dart lib/mobile/pages/connection_page.dart lib/mobile/pages/settings_page.dart lib/mobile/widgets/dialog.dart lib/web/bridge.dart
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/common.dart lib/desktop/pages/connection_page.dart lib/desktop/pages/install_page.dart lib/desktop/pages/desktop_home_page.dart lib/desktop/pages/port_forward_page.dart lib/models/model.dart lib/common/widgets/dialog.dart lib/common/widgets/login.dart lib/common/widgets/geodom_update_dialog.dart lib/common/widgets/peer_tab_page.dart lib/desktop/pages/desktop_setting_page.dart lib/mobile/pages/connection_page.dart lib/mobile/pages/settings_page.dart lib/mobile/widgets/dialog.dart lib/web/bridge.dart
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/models/ab_model.dart lib/models/geodom_recent_sync.dart lib/models/peer_model.dart lib/common/widgets/address_book.dart lib/common/widgets/peer_card.dart lib/utils/http_service.dart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geodomdesk-bridge
          if-no-files-found: error
          path: |
            client/src/bridge_generated.rs
            client/src/bridge_generated.io.rs
            client/flutter/lib/generated_bridge.dart
            client/flutter/lib/generated_bridge.freezed.dart
            client/flutter/lib/desktop/pages/desktop_home_page.dart
            client/flutter/lib/desktop/pages/port_forward_page.dart
            client/flutter/lib/common.dart
            client/flutter/lib/desktop/pages/connection_page.dart
            client/flutter/lib/desktop/pages/install_page.dart
            client/flutter/lib/models/model.dart
            client/flutter/lib/common/widgets/dialog.dart
            client/flutter/lib/common/widgets/login.dart
            client/flutter/lib/desktop/pages/desktop_setting_page.dart
            client/flutter/lib/mobile/pages/connection_page.dart
            client/flutter/lib/mobile/pages/settings_page.dart
            client/flutter/lib/mobile/widgets/dialog.dart
            client/flutter/lib/web/bridge.dart

  windows:
    needs: [plan, bridge]
    if: needs.plan.outputs.reuse_run == ''
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        working-directory: client
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_COMMIT }}
          submodules: recursive
          path: client
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: '15.0.6'
      - name: Install current CMake for pinned vcpkg
        shell: pwsh
        run: |
          python -m pip install cmake==4.3.0 -r ../customization/requirements.txt -r ./libs/portable/requirements.txt
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare independent client identity
        run: python ../customization/packaging/prepare_client.py --source . --version $env:VERSION --build-number $env:BUILD_NUMBER
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-bridge
          path: client
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: client
          prefix-key: geodomdesk-windows-thin
          cache-on-failure: true
      - name: Patch the pinned Flutter SDK
        run: python ../customization/packaging/patch_flutter_sdk.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ env.UPSTREAM_COMMIT }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: geodomdesk-vcpkg-windows-x64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('client/vcpkg.json', 'client/res/vcpkg/**') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          doNotCache: false
      - name: Build native dependencies
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          cd "$GITHUB_WORKSPACE/client"
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build Windows Flutter bundle and CLI
        run: |
          $features = python ./build.py --print-features --flutter --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine native features' }
          cargo build --locked --release --features $features --lib --bin geodomdesk-cli
          if ($LASTEXITCODE -ne 0) { throw 'Native Rust build failed' }
          if (!(Test-Path ./target/release/librustdesk.dll) -or !(Test-Path ./target/release/geodomdesk-cli.exe)) {
            throw 'Expected compiled librustdesk.dll and geodomdesk-cli.exe'
          }
          python ./build.py --portable --flutter --skip-cargo --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows build failed' }
          $exe = './flutter/build/windows/x64/runner/Release/GeodomDesk.exe'
          $version = (& $exe --version | Out-String).Trim()
          if ($version -ne $env:VERSION) { throw "Wrong compiled client version: $version" }
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          if ($info.ProductName -ne 'GeodomDesk') { throw 'The runner is not GeodomDesk' }
          Copy-Item ./target/release/geodomdesk-cli.exe ./flutter/build/windows/x64/runner/Release/
      - name: Verify Windows terminal CLI and regression tests
        run: |
          $features = python ./build.py --print-features --flutter --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine native features' }
          python -m unittest discover -s ../customization/tests -p test_terminal_cli.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Terminal CLI stream forwarding failed' }
          cargo test --locked --release --features $features --lib '--' terminal_exec:: client::transport_race:: client::native_udp_probe_tests:: client::webrtc_race_tests:: client::retry_tests:: port_forward_mux:: port_forward::login_tests:: server::port_forward_mux:: rendezvous_mediator::tests:: kcp_stream::tests:: server::video_service::tests:: common::tests::test_udp_punch audio_resampler::allocation_tests:: geodomdesk_recent::tests:: port_forward::
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
          $cli = './flutter/build/windows/x64/runner/Release/geodomdesk-cli.exe'
          $help = (& $cli --help | Out-String)
          if ($LASTEXITCODE -ne 0 -or !$help.Contains('geodomdesk-cli exec')) { throw 'Bundled terminal CLI could not start the main client' }
          $env:GEODOMDESK_TEST_CLIENT = (Resolve-Path ./flutter/build/windows/x64/runner/Release/GeodomDesk.exe).Path
          cargo test --locked --release --features $features --lib terminal_exec::windows::tests::native_powershell_helper_round_trip -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { throw 'Native PowerShell execution failed' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/topmost-helper-cache
          key: geodomdesk-topmost-windows-x64-v143-ecd8d6a139eee76845ea66423fb739af450fda90
      - name: Build the independent privacy helper
        shell: pwsh
        run: |
          $cached = Join-Path $env:RUNNER_TEMP 'topmost-helper-cache/WindowInjection.dll'
          if (!(Test-Path -LiteralPath $cached)) {
            git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow ../topmost-helper
            git -C ../topmost-helper checkout ecd8d6a139eee76845ea66423fb739af450fda90
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
            & "$vs\MSBuild\Current\Bin\MSBuild.exe" ../topmost-helper/WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 -p:TargetVersion=Windows10 -p:PlatformToolset=v143
            if ($LASTEXITCODE -ne 0) { throw 'Privacy helper build failed' }
            New-Item -ItemType Directory -Force (Split-Path -Parent $cached) | Out-Null
            Copy-Item ../topmost-helper/WindowInjection/x64/Release/WindowInjection.dll $cached
          }
          Copy-Item $cached ./flutter/build/windows/x64/runner/Release/WindowInjection.dll
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/printer-assets
          key: geodomdesk-printer-assets-${{ hashFiles('customization/config/printer-assets.json') }}
      - name: Create portable update executable
        shell: pwsh
        run: |
          python ../customization/packaging/prepare_printer.py --destination ./flutter/build/windows/x64/runner/Release --cache "$env:RUNNER_TEMP/printer-assets"
          if ($LASTEXITCODE -ne 0) { throw 'Printer components missing or unverified' }
          Push-Location libs/portable
          python ./generate.py -l 6 -f ../../flutter/build/windows/x64/runner/Release -o . -e ../../flutter/build/windows/x64/runner/Release/GeodomDesk.exe
          if ($LASTEXITCODE -ne 0) { throw 'Portable packer failed' }
          Pop-Location
          New-Item -ItemType Directory -Force ../windows-artifact | Out-Null
          Copy-Item ./target/release/rustdesk-portable-packer.exe ../windows-artifact/GeodomDesk.exe
          Copy-Item ./geodomdesk-build-config.json ../windows-artifact/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geodomdesk-windows
          if-no-files-found: error
          path: windows-artifact/*
      - name: Verify native Windows installation and fixed connection settings
        run: ../customization/tests/windows/test-windows-native.ps1 -Package ../windows-artifact/GeodomDesk.exe -BuildConfig geodomdesk-build-config.json

  ubuntu:
    needs: [plan, bridge]
    if: needs.plan.outputs.reuse_run == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: client
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
      VCPKG_DEFAULT_TRIPLET: x64-linux
      VCPKG_DEFAULT_HOST_TRIPLET: x64-linux
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_COMMIT }}
          submodules: recursive
          path: client
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install native build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends build-essential clang cmake curl git lld libayatana-appindicator3-dev libasound2-dev libclang-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev libxtst-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols libdbus-1-dev libpam0g-dev nasm ninja-build pkg-config unzip xz-utils libssl-dev autoconf automake libtool
          python3 -m pip install cmake==4.3.0 -r ../customization/requirements.txt
          python3 -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> "$GITHUB_PATH"
      - name: Prepare independent client identity
        run: python3 ../customization/packaging/prepare_client.py --source . --version "$VERSION" --build-number "$BUILD_NUMBER"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-bridge
          path: client
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: client
          prefix-key: geodomdesk-ubuntu-thin
          cache-on-failure: true
      - name: Patch the pinned Flutter SDK
        run: python3 ../customization/packaging/patch_flutter_sdk.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ env.UPSTREAM_COMMIT }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: geodomdesk-vcpkg-ubuntu-x64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('client/vcpkg.json', 'client/res/vcpkg/**') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          doNotCache: false
      - name: Build native dependencies and Ubuntu package
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"
          export DEB_ARCH=amd64
          features=$(python3 ./build.py --print-features --flutter --hwcodec --unix-file-copy-paste)
          cargo build --locked --release --features "$features" --lib --bin geodomdesk-cli
          python3 -c 'import build; build.ffi_bindgen_function_refactor()'
          python3 ./build.py --flutter --skip-cargo --hwcodec --unix-file-copy-paste
          cargo test --locked --release --features "$features" --lib -- terminal_exec:: client::transport_race:: client::native_udp_probe_tests:: client::webrtc_race_tests:: client::retry_tests:: port_forward_mux:: port_forward::login_tests:: server::port_forward_mux:: rendezvous_mediator::tests:: kcp_stream::tests:: server::video_service::tests:: common::tests::test_udp_punch geodomdesk_recent::tests:: port_forward::
          python3 -m unittest discover -s ../customization/tests -p test_terminal_cli.py -v
          mkdir -p ../ubuntu-artifact
          python3 ../customization/packaging/repack_deb.py --input "rustdesk-$VERSION.deb" --output ../ubuntu-artifact/geodomdesk.deb --version "$VERSION" --build-number "$BUILD_NUMBER" --cli target/release/geodomdesk-cli
          dpkg-deb -x ../ubuntu-artifact/geodomdesk.deb "$RUNNER_TEMP/geodomdesk-package"
          "$RUNNER_TEMP/geodomdesk-package/usr/bin/geodomdesk-cli" --help | grep -F 'geodomdesk-cli exec'
          cp geodomdesk-build-config.json ../ubuntu-artifact/
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geodomdesk-ubuntu
          if-no-files-found: error
          path: ubuntu-artifact/*

  android:
    needs: [plan, bridge]
    if: github.event_name != 'pull_request' && !inputs.validation_only
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: client
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_COMMIT }}
          submodules: recursive
          path: client
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            client/flutter/android/**/*.gradle
            client/flutter/android/gradle/wrapper/gradle-wrapper.properties
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
      - name: Install Android build dependencies
        id: android-sdk
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends build-essential clang cmake curl gcc-multilib g++-multilib libclang-dev nasm ninja-build pkg-config autoconf automake libtool
          python3 -m pip install cmake==4.3.0 -r ../customization/requirements.txt
          python3 -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "sdk_root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ steps.android-sdk.outputs.sdk_root }}/platforms/android-36
            ${{ steps.android-sdk.outputs.sdk_root }}/build-tools/36.0.0
          key: ${{ runner.os }}-android-sdk-36-36.0.0
      - name: Ensure Android SDK platform and build tools
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-36" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            set +o pipefail
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - name: Prepare independent Android client
        run: |
          python3 ../customization/packaging/prepare_client.py --source . --version "$VERSION" --build-number "$BUILD_NUMBER"
          python3 ../customization/packaging/patch_flutter_sdk.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-bridge
          path: client
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: client
          prefix-key: geodomdesk-android-arm64-thin
          cache-on-failure: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ env.UPSTREAM_COMMIT }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: geodomdesk-vcpkg-android-arm64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('client/vcpkg.json', 'client/res/vcpkg/**') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          doNotCache: false
      - name: Build Android native dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          ./flutter/build_android_deps.sh arm64-v8a
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-bin-ndk-${{ env.RUST_VERSION }}-3.1.2
      - name: Build Android Rust library
        run: |
          if [[ "$(cargo ndk --version 2>/dev/null)" != "cargo-ndk 3.1.2" ]]; then
            cargo install cargo-ndk --version '=3.1.2' --locked --force
          fi
          ./flutter/ndk_arm64.sh
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" flutter/android/app/src/main/jniLibs/arm64-v8a/
          python3 -c 'import build; build.ffi_bindgen_function_refactor()'
      - name: Configure permanent Android signing identity
        env:
          GEODOMDESK_ANDROID_KEYSTORE: ${{ secrets.GEODOMDESK_ANDROID_KEYSTORE }}
          GEODOMDESK_ANDROID_KEY_PASSWORD: ${{ secrets.GEODOMDESK_ANDROID_KEY_PASSWORD }}
        run: python3 ../customization/packaging/android_release.py prepare --source . --file "$RUNNER_TEMP/geodomdesk-signing.p12"
      - name: Build and verify signed Android APK
        run: |
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/' flutter/android/gradle.properties
          printf '\norg.gradle.parallel=true\norg.gradle.caching=true\n' >> flutter/android/gradle.properties
          cd flutter
          flutter pub get
          dart run flutter_launcher_icons -f ../../customization/config/android-icons.yaml
          # One ABI needs no split; Flutter otherwise adds an ABI offset to versionCode.
          flutter build apk --release --target-platform android-arm64 --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          cd ..
          python3 ../customization/packaging/android_release.py verify --source . --file flutter/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p ../android-artifact
          cp flutter/build/app/outputs/flutter-apk/app-release.apk ../android-artifact/geodomdesk.apk
          cp geodomdesk-build-config.json ../android-artifact/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: geodomdesk-android-diagnostic
          if-no-files-found: ignore
          retention-days: 3
          path: client/flutter/build/app/outputs/flutter-apk/app-release.apk
      - name: Remove temporary signing inputs
        if: always()
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "geodomdesk-signing.p12").unlink(missing_ok=True); pathlib.Path("flutter/android/key.properties").unlink(missing_ok=True)'
      - name: Archive corresponding source with generated Android resources
        run: python3 ../customization/packaging/archive_source.py --source . --customization ../customization --output ../android-artifact/geodomdesk-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geodomdesk-android
          if-no-files-found: error
          path: android-artifact/*

  reused_windows:
    needs: plan
    if: needs.plan.outputs.reuse_run != ''
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-windows
          path: reused-windows
          run-id: ${{ needs.plan.outputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Revalidate the unchanged native Windows build
        shell: pwsh
        run: ./customization/tests/windows/test-windows-native.ps1 -Package ./reused-windows/GeodomDesk.exe -BuildConfig ./reused-windows/geodomdesk-build-config.json

  release:
    needs: [plan, windows, ubuntu, android, reused_windows]
    if: always() && github.ref == 'refs/heads/main' && !inputs.validation_only && needs.plan.result == 'success' && needs.android.result == 'success' && ((needs.plan.outputs.reuse_run != '' && needs.reused_windows.result == 'success') || (needs.windows.result == 'success' && needs.ubuntu.result == 'success'))
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-windows
          path: windows
          run-id: ${{ needs.plan.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-ubuntu
          path: ubuntu
          run-id: ${{ needs.plan.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: geodomdesk-android
          path: android
      - name: Validate all builds and write release descriptor
        run: |
          python3 -c 'import json,pathlib; configs=[json.loads(pathlib.Path(p,"geodomdesk-build-config.json").read_text()) for p in ["windows","ubuntu","android"]]; assert all(config == configs[0] for config in configs)'
          python3 -m pip install -r customization/requirements.txt
          python3 customization/release/release_bundle.py --version "$VERSION" --repository "$GITHUB_REPOSITORY" --windows windows/GeodomDesk.exe --ubuntu ubuntu/geodomdesk.deb --android android/geodomdesk.apk --source-archive android/geodomdesk-source.tar.gz --build-config windows/geodomdesk-build-config.json --changelog-file CHANGELOG.md --output release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geodomdesk-release
          if-no-files-found: error
          path: release/*
      - name: Publish a new stable Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: customization
        run: |
          python3 -c 'import os; from release.plan_upstream import require_publishable_version; require_publishable_version(os.environ["GITHUB_REPOSITORY"], os.environ["VERSION"], int(os.environ["BUILD_NUMBER"]))'
          python3 -c 'import json, pathlib; data = json.loads(pathlib.Path("release/geodomdesk-build.json").read_text(encoding="utf-8")); notes = (data.get("changelog") or "").strip() or "Follows the official RustDesk version with GeodomDesk customization. Immutable custom build assets are listed in geodomdesk-build.json."; pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")'
          payloads=()
          for file in release/*; do
            if [ "$(basename "$file")" != geodomdesk-build.json ]; then payloads+=("$file"); fi
          done
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${payloads[@]}"
            gh release upload "$VERSION" release/geodomdesk-build.json --clobber
            gh release edit "$VERSION" --notes-file release-notes.md --draft=false --latest
          else
            gh release create "$VERSION" "${payloads[@]}" --target "$GITHUB_SHA" --draft --title "GeodomDesk $VERSION" --notes-file release-notes.md
            gh release upload "$VERSION" release/geodomdesk-build.json
            gh release edit "$VERSION" --draft=false --latest
          fi
          rm -f release-notes.md
