name: Sync RustDesk Upstream
run-name: RustDesk upstream sync · ${{ inputs.upstream_version || 'latest stable' }}

on:
  schedule:
    - cron: '35 */12 * * *'
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Official stable RustDesk release tag. Leave blank to select the latest stable release.'
        type: string
        default: ''
      retry_codex:
        description: 'Recheck the reviewed release and allow another Codex attempt for the same source pair.'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: geodomdesk-rustdesk-repair
  cancel-in-progress: false

jobs:
  prepare_update:
    name: Prepare upstream update
    if: github.repository == 'lovely-xin/GeodomDesk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      upstream_commit: ${{ steps.release.outputs.upstream_commit }}
      repair_needed: ${{ steps.preflight.outputs.repair_needed }}
      patch_sha256: ${{ steps.patch.outputs.sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Resolve the official stable release
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.upstream_version }}
          RETRY_CODEX: ${{ inputs.retry_codex }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--version "$REQUESTED_VERSION")
          if [[ "$RETRY_CODEX" == 'true' ]]; then
            args+=(--recheck)
          fi
          python3 .github/scripts/rustdesk_sync.py resolve "${args[@]}"
      - name: Check for an existing conflict repair attempt
        id: attempt
        if: steps.release.outputs.check_required == 'true' && !inputs.retry_codex
        env:
          ATTEMPT_NAME: ${{ steps.release.outputs.attempt_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/rustdesk_sync.py check-attempt --name "$ATTEMPT_NAME"
      - name: Install preparation dependencies
        if: steps.release.outputs.check_required == 'true' && steps.attempt.outputs.already_attempted != 'true'
        run: python3 -m pip install -r customization/requirements.txt
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: steps.release.outputs.check_required == 'true' && steps.attempt.outputs.already_attempted != 'true'
        with:
          repository: rustdesk/rustdesk
          ref: ${{ steps.release.outputs.upstream_commit }}
          submodules: recursive
          path: client
          persist-credentials: false
      - name: Try deterministic customization merge
        id: preflight
        if: steps.release.outputs.check_required == 'true' && steps.attempt.outputs.already_attempted != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          UPSTREAM_COMMIT: ${{ steps.release.outputs.upstream_commit }}
        run: |
          python3 .github/scripts/rustdesk_sync.py preflight --source client --version "$VERSION" --commit "$UPSTREAM_COMMIT" \
            2>&1 | tee "$RUNNER_TEMP/rustdesk-preflight.log"
      - name: Record the conflict repair attempt
        if: steps.preflight.outputs.use_codex == 'true'
        run: printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/rustdesk-repair-attempt.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        name: Save the conflict repair attempt
        if: steps.preflight.outputs.use_codex == 'true'
        with:
          name: ${{ steps.release.outputs.attempt_name }}
          path: ${{ runner.temp }}/rustdesk-repair-attempt.txt
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - name: Repair customization conflicts with Codex
        if: steps.preflight.outputs.use_codex == 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          prompt: |
            Prepare GeodomDesk for official RustDesk ${{ steps.release.outputs.version }} at commit ${{ steps.release.outputs.upstream_commit }}.
            Start with the final 30 lines of ${{ runner.temp }}/rustdesk-preflight.log. Use the pristine upstream checkout in client/ and inspect the affected files. If needed, run customization/prepare_client.py against a disposable copy of client/.
            Refresh customization/reference and source-lock.json from the official source, including files removed upstream. Set only upstream_commit in customization/config/client-channel.json to the requested commit. Adapt the existing customization code and client overlays with the smallest changes needed.
            Keep installation signature, hash and path checks intact. Preserve Windows/Linux CLI, TCP tunnel ownership, closure and reconnect behavior. Preserve existing tests, validation code, GitHub workflows, dependencies, release credentials and publication settings.
            Changes may only affect customization/reference, client overlays, customization adapters other than customizations/upstream.py, and the upstream commit pin. Leave client/ pristine. Apply the edits and summarize the affected files. Later jobs run the full regression suite.
      - name: Create customization patch
        id: patch
        if: steps.preflight.outputs.repair_needed == 'true'
        run: |
          git add -N --all
          git diff --binary "$GITHUB_SHA" > "$RUNNER_TEMP/rustdesk-customization.patch"
          if [[ ! -s "$RUNNER_TEMP/rustdesk-customization.patch" ]]; then
            echo '::error::The upstream update produced an empty customization patch.'
            exit 1
          fi
          echo "sha256=$(sha256sum "$RUNNER_TEMP/rustdesk-customization.patch" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.preflight.outputs.repair_needed == 'true'
        with:
          name: rustdesk-customization-patch
          path: ${{ runner.temp }}/rustdesk-customization.patch
          if-no-files-found: error

  validate_patch:
    name: Validate customization patch
    needs: prepare_update
    if: needs.prepare_update.outputs.repair_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare_update.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.prepare_update.outputs.upstream_commit }}
      PATCH_SHA256: ${{ needs.prepare_update.outputs.patch_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.UPSTREAM_COMMIT }}
          submodules: recursive
          path: client
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rustdesk-customization-patch
          path: ${{ runner.temp }}/upstream-sync
      - name: Validate the exact upstream baseline and run project checks
        env:
          PYTHONPATH: customization
        run: |
          python3 -m pip install -r customization/requirements.txt
          patch="$RUNNER_TEMP/upstream-sync/rustdesk-customization.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch" | sha256sum --check
          cp .github/scripts/rustdesk_sync.py "$RUNNER_TEMP/validate-upstream-sync.py"
          git apply --index "$patch"
          git diff --cached --check
          python3 -I "$RUNNER_TEMP/validate-upstream-sync.py" validate --source client --version "$VERSION" --commit "$UPSTREAM_COMMIT"
          python3 -m unittest discover -s customization/tests

  stage_candidate:
    name: Stage release candidate
    needs: [prepare_update, validate_patch]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.candidate.outputs.branch }}
      commit: ${{ steps.candidate.outputs.commit }}
    env:
      VERSION: ${{ needs.prepare_update.outputs.version }}
      PATCH_SHA256: ${{ needs.prepare_update.outputs.patch_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rustdesk-customization-patch
          path: ${{ runner.temp }}/upstream-sync
      - name: Push the validated patch to an isolated branch
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main moved during this run. Rerun the repair against the latest main.'
            exit 1
          fi
          patch="$RUNNER_TEMP/upstream-sync/rustdesk-customization.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch" | sha256sum --check
          cp .github/scripts/rustdesk_sync.py "$RUNNER_TEMP/validate-upstream-sync.py"
          git apply --index "$patch"
          python3 -I "$RUNNER_TEMP/validate-upstream-sync.py" scope
          branch="upstream/rustdesk-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Adapt GeodomDesk to RustDesk $VERSION"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify_native:
    name: Verify Windows and Ubuntu builds
    needs: stage_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 265
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Require a successful Windows and Ubuntu build for the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.stage_candidate.outputs.branch }}
          COMMIT: ${{ needs.stage_candidate.outputs.commit }}
        run: python3 .github/scripts/dispatch_geodomdesk_build.py "$BRANCH" "$COMMIT" --validation-only

  merge_update:
    name: Merge verified upstream update
    needs: [prepare_update, stage_candidate, verify_native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      commit: ${{ steps.merge.outputs.commit }}
    steps:
      - name: Merge the verified repair PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.stage_candidate.outputs.branch }}
          COMMIT: ${{ needs.stage_candidate.outputs.commit }}
          VERSION: ${{ needs.prepare_update.outputs.version }}
          UPSTREAM_COMMIT: ${{ needs.prepare_update.outputs.upstream_commit }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY"
          if [[ "$(gh api "$endpoint/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]]; then
            echo '::error::Main advanced during verification. Rerun the sync from the current main.'
            exit 1
          fi
          pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Adapt GeodomDesk to RustDesk $VERSION" \
            --body "Official upstream commit: $UPSTREAM_COMMIT. Source preparation and Windows/Ubuntu native builds passed in [the sync run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).")
          method=$(gh api "$endpoint" --jq 'if .allow_merge_commit then "merge" elif .allow_squash_merge then "squash" else "rebase" end')
          merged=$(gh api "$endpoint/pulls/${pr##*/}/merge" --method PUT \
            -f sha="$COMMIT" -f merge_method="$method" --jq 'select(.merged) | .sha')
          if [[ ! "$merged" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::GitHub did not confirm the verified pull request merge.'
            exit 1
          fi
          verified_tree=$(gh api "$endpoint/git/commits/$COMMIT" --jq .tree.sha)
          merged_tree=$(gh api "$endpoint/git/commits/$merged" --jq .tree.sha)
          if [[ "$verified_tree" != "$merged_tree" ]]; then
            echo '::error::The merged tree differs from the verified candidate.'
            exit 1
          fi
          echo "commit=$merged" >> "$GITHUB_OUTPUT"
          echo "Merged $pr at \`$merged\`." >> "$GITHUB_STEP_SUMMARY"

  publish_release:
    name: Publish GeodomDesk release
    needs: merge_update
    runs-on: ubuntu-latest
    timeout-minutes: 275
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build and publish the merged commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.merge_update.outputs.commit }}
        run: python3 .github/scripts/dispatch_geodomdesk_build.py main "$COMMIT"
